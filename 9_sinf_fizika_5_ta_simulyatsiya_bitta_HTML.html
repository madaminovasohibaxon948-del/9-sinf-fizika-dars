<script>
function decodeBase64Utf8(b64){const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(bytes)}
const frames=[...document.querySelectorAll('.frame')];
frames.forEach(f=>{f.srcdoc=decodeBase64Utf8(f.dataset.b64)});
function showFrame(n){frames.forEach((f,i)=>f.classList.toggle('active',i===n));document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active',i===n));window.scrollTo(0,0)}
showFrame(0);
</script>
